[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labo-research-tools"
version = "0.1.0"
description = "Public CLI tools for story-centered mathematical research"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
labo = "labo_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labo_tools = ["assets/*.js"]
